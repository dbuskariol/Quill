name: Quill
options:
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_IDENTITY: '-'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Quill:
    type: application
    platform: macOS
    sources: [Quill]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dbuskariol.quill
        INFOPLIST_FILE: Configuration/Quill-Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  QuillTests:
    type: bundle.unit-test
    platform: macOS
    sources: [QuillTests]
    dependencies:
      - target: Quill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dbuskariol.quill.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Quill:
    build:
      targets:
        Quill: all
        QuillTests: [test]
    test:
      targets: [QuillTests]
